name: Ashes CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r apps/api/requirements.txt
      - run: python -m compileall apps/api tools/migrate_sqlite_to_mongo.py
      - run: python -c "import apps.api.mongo_db; print('Mongo module import OK')"
      - run: python -m py_compile apps/api/media_storage.py apps/api/storage_main.py apps/api/production.py
