name: Ashes CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r apps/api/requirements.txt pytest
      - run: python -m compileall apps/api tools/migrate_sqlite_to_mongo.py
      - run: python -c "import apps.api.mongo_db; print('Mongo module import OK')"
      - run: python -m py_compile apps/api/media_storage.py apps/api/storage_main.py apps/api/storage_menu_import.py apps/api/subscriptions.py apps/api/billing_settings.py apps/api/billing_provider.py apps/api/billing.py apps/api/admin.py apps/api/manual_payments.py apps/api/production.py
      - run: pytest -q tests/test_storage_generation.py tests/test_subscriptions.py
