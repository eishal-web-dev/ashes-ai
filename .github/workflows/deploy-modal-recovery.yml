name: Deploy Ashes Modal Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/trellis/modal_recovery_index.py'
      - '.github/workflows/deploy-modal-recovery.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ASHES_TRELLIS_WORKER_TOKEN: ${{ secrets.ASHES_TRELLIS_WORKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade modal
      - run: modal token info
      - run: modal deploy tools/trellis/modal_recovery_index.py --name ashes-trellis-recovery
