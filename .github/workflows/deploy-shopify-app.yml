name: Deploy Shopify App Version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Shopify configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@latest

      - name: Deploy Ashes AI app version
        working-directory: shopify
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: >-
          shopify app deploy
          --allow-updates
          --client-id c32e874c004cd9ea236c6c4af326f03a
          --version version07
          --message "App Bridge session auth + mandatory privacy and uninstall webhooks"
          --source-control-url "$COMMIT_URL"
