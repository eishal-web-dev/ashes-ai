name: Deploy Ashes Modal Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/trellis/modal_ashes_worker.py'
      - 'scripts/patch_trellis_multiview_t4.py'
      - '.github/workflows/deploy-modal-worker.yml'

concurrency:
  group: ashes-modal-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy TRELLIS worker to Modal
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ASHES_TRELLIS_WORKER_TOKEN: ${{ secrets.ASHES_TRELLIS_WORKER_TOKEN }}

    steps:
      - name: Check Modal credentials
        id: modal_credentials
        shell: bash
        run: |
          if [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Modal credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Modal credentials are not configured; deployment cannot continue."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install modal

      - name: Verify Modal token
        run: modal token info

      - name: Apply T4-safe multi-view profile
        run: python scripts/patch_trellis_multiview_t4.py

      - name: Patch TRELLIS build for Modal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/trellis/modal_ashes_worker.py')
          text = path.read_text()
          old = '"source setup.sh --basic --spconv; "'
          new = (
              '"python -m pip install --no-cache-dir pillow imageio imageio-ffmpeg tqdm easydict opencv-python-headless scipy ninja rembg onnxruntime trimesh open3d xatlas pyvista pymeshfix igraph transformers; "\n'
              '                "python -m pip install --no-cache-dir git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8; "\n'
              '                "python -m pip install --no-cache-dir spconv-cu120; "'
          )
          if old in text:
              path.write_text(text.replace(old, new, 1))
              print('Patched TRELLIS dependency installation for Modal')
          else:
              print('TRELLIS dependency patch already applied or no longer required')
          PY

      - name: Deploy Ashes TRELLIS worker
        run: modal deploy tools/trellis/modal_ashes_worker.py --name ashes-trellis-worker

      - name: Verify deployed endpoint
        shell: bash
        run: |
          sleep 3
          python - <<'PY'
          import os, requests
          url='https://ashes-ai-26--ashes-trellis-worker-web.modal.run/health'
          headers={}
          token=os.getenv('ASHES_TRELLIS_WORKER_TOKEN','').strip()
          if token:
              headers['Authorization']=f'Bearer {token}'
          r=requests.get(url,headers=headers,timeout=30)
          print(r.status_code, r.text[:1000])
          r.raise_for_status()
          PY
