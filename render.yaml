services:
  - type: web
    name: ashes-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: uvicorn apps.api.production:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /production-health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ashes_ai
      - key: ASHES_PUBLIC_BASE_URL
        sync: false
      - key: ASHES_API_BASE_URL
        sync: false
      - key: ASHES_ALLOWED_ORIGINS
        sync: false
      - key: ASHES_ADMIN_EMAILS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ASHES_MENU_IMPORT_PROVIDER
        value: openai
      - key: ASHES_MENU_VISION_MODEL
        value: gpt-5.5
      - key: ASHES_STORAGE_PROVIDER
        value: r2
      - key: ASHES_S3_BUCKET
        sync: false
      - key: ASHES_S3_ENDPOINT_URL
        sync: false
      - key: ASHES_S3_REGION
        value: auto
      - key: ASHES_S3_ACCESS_KEY_ID
        sync: false
      - key: ASHES_S3_SECRET_ACCESS_KEY
        sync: false
      - key: ASHES_S3_PUBLIC_BASE_URL
        sync: false
